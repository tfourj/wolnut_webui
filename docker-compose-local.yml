services:
    wolnut:
        build: .
        # image: hardwarehaven/wolnut:latest
        container_name: wolnut
        network_mode: host
        restart: unless-stopped
        # WebUI is available at http://<host>:8183
        # network_mode host already exposes 8183; the ports mapping below is for
        # bridge mode (if you remove network_mode host, uncomment ports)
        #ports:
        #    - "8183:8183"
        volumes:
            - ./config:/config
        environment:
            - WOLNUT_WEB_PORT=8183
            - ADMIN_USERNAME=admin
            - ADMIN_PASSWORD=changeme
            - WOLNUT_JWT_SECRET=change-this-to-a-long-random-secret
