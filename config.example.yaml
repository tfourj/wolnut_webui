# copy this to config.yaml befor running wolnut
log_level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL

nut:
  ups: "ups@localhost"        # Format: <ups-name>@<host>
  username: "upsmon"          # Optional: omit if NUT server doesn't require auth
  password: "password"

poll_interval: 15             # Poll interval in seconds — should be shorter than the NUT shutdown delay on any client
status_file: "/config/wolnut_state.json"  # Path to status file, recommended you change this to be outside container if using Docker

wake_on:
  restore_delay_sec: 30       # Delay (in seconds) after power is restored before sending WOL
  min_battery_percent: 25     # Wait until battery reaches this percent before WOL
  client_timeout_sec: 600     # Time to wait for client to come back online before logging an error
  reattempt_delay: 30         # Minimum time (in seconds) between WOL attempts per client

webui:
  suppress_mac_warnings: false  # Set true to hide orange warnings when MAC "auto" cannot be resolved

notifications:
  discord:
    enabled: false
    webhook_url: "https://discord.com/api/webhooks/your-webhook-id/your-webhook-token"
  gotify:
    enabled: false
    url: "https://gotify.example.com"
    token: "your-gotify-app-token"
    priority: 5
  ntfy:
    enabled: false
    url: "https://ntfy.sh"
    topic: "your-ntfy-topic"
    token: ""  # Optional bearer token for protected topics
    priority: 3  # 1 is lowest, 3 is default, 5 is highest
  events:
    power_loss: true
    power_restored: true
    wake_sent: true
    client_recovered: true
    errors: true

clients:
  - name: "client 1"                  # Human-readable name
    host: 192.168.0.100               # IP address preferred for reliability
    mac: 38:f7:cd:c5:87:6b
    always_wake: false               # Default: only wake if online before outage; true = always wake even if asleep/offline
    enabled: true                    # Set false to temporarily disable without deleting
    wake_enabled: true               # Set false for shutdown-only devices
    shutdown:
      enabled: false                 # Pair the agent before enabling
      battery_percent: 20            # Shut down at or below this UPS charge
      agent_id: null                 # Managed by the pairing flow
      agent_port: 8184
  - name: "client 2"
    host: hostname.local             # You can use a hostname if it resolves to a reachable interface
    mac: auto                        # MAC will be resolved using ARP at runtime
    always_wake: true                # Example: always wake this host after power restore
    enabled: true
