services:
    wolnut:
        image: ghcr.io/tfourj/wolnut_webui:latest
        #build: .
        container_name: wolnut
        network_mode: host
        restart: unless-stopped
        volumes:
            - ./config:/config
        environment:
            #- WOLNUT_WEB_PORT=8183
            - ADMIN_USERNAME=admin
            - ADMIN_PASSWORD=changeme
            - WOLNUT_JWT_SECRET=change-this-to-a-long-random-secret
            # Trust HTTPS forwarding only from the reverse proxy address.
            #- WOLNUT_FORWARDED_ALLOW_IPS=127.0.0.1
            # Public HTTPS address embedded in one-line agent install commands.
            #- WOLNUT_PUBLIC_URL=https://wolnut.example.com
            # Optional HTTPS release mirror containing agent binaries and checksums.
            #- WOLNUT_AGENT_DOWNLOAD_BASE_URL=https://github.com/tfourj/wolnut_webui/releases/latest/download
            #- WOLNUT_SECURITY_DIR=/config/security
