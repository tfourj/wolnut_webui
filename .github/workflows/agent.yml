name: Agent CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Go agent
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  build:
    name: Build Linux ${{ matrix.arch }} agent
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache: false
      - name: Set up arm64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Create output directory
        run: mkdir -p ../dist
      - name: Build static agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: >-
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}"
          -o ../dist/wolnut-agent-linux-${GOARCH} .
      - name: Smoke test agent binary
        run: ../dist/wolnut-agent-linux-${{ matrix.arch }} version
      - name: Create checksum
        working-directory: dist
        run: sha256sum wolnut-agent-linux-${{ matrix.arch }} > wolnut-agent-linux-${{ matrix.arch }}.sha256
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wolnut-agent-linux-${{ matrix.arch }}
          path: |
            dist/wolnut-agent-linux-${{ matrix.arch }}
            dist/wolnut-agent-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  release:
    name: Publish tagged agent release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          pattern: wolnut-agent-linux-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/wolnut-agent-linux-amd64
            dist/wolnut-agent-linux-amd64.sha256
            dist/wolnut-agent-linux-arm64
            dist/wolnut-agent-linux-arm64.sha256
